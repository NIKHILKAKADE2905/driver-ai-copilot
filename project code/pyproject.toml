[project]
name = "project-code"
version = "0.2.0"
description = "AI Co-Pilot FastAPI backend: drowsiness dialogue and rest-stop search."
readme = "MVP.md"
authors = [
    { name = "Nikhil", email = "nikhilkakade401@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langchain>=1.0.0",
    "langchain-groq>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "speechrecognition>=3.10.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
project-code = "project_code:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
